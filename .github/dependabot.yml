version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    assignees:
      - SamsterZero
    labels:
      - enhancement
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    assignees:
      - SamsterZero
    labels:
      - enhancement
